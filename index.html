<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苯 - 一个小小的服务器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #0a0f1a;
            color: #e8f1ff;
            line-height: 1.7;
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }

        .benzene-container {
            width: 280px;
            height: 280px;
            margin-bottom: 0.25rem;
            perspective: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .benzene-ring {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            filter:
                drop-shadow(0 1px 0 rgba(51, 139, 255, 0.55))
                drop-shadow(0 2px 0 rgba(51, 139, 255, 0.5))
                drop-shadow(0 3px 0 rgba(51, 139, 255, 0.45))
                drop-shadow(0 4px 0 rgba(51, 139, 255, 0.4))
                drop-shadow(0 5px 0 rgba(51, 139, 255, 0.35))
                drop-shadow(0 6px 0 rgba(51, 139, 255, 0.3))
                drop-shadow(0 8px 16px rgba(51, 139, 255, 0.35));
        }

        .main-title {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #338bff;
            margin-bottom: 0.3rem;
        }

        .version {
            color: #8ba3c7;
            font-size: 0.95rem;
        }

        .sections {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 1.5rem 5rem;
        }

        .section {
            padding: 3.5rem 0;
        }

        .section:not(:last-child) {
            border-bottom: 1px solid rgba(51, 139, 255, 0.15);
        }

        .section-title {
            font-size: 1.5rem;
            color: #338bff;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .section p {
            color: #8ba3c7;
            font-size: 1rem;
        }

        .placeholder {
            color: #5a7299;
            font-size: 0.95rem;
            margin-top: 0.75rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
            margin-top: 1.5rem;
        }

        .gallery-grid img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            background-color: #0d1320;
            cursor: zoom-in;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 2rem;
            cursor: zoom-out;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 2rem 1.5rem;
            color: #5a7299;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="benzene-container" id="benzeneContainer">
            <img class="benzene-ring" id="benzeneRing" src="benzene-blue.webp" alt="苯环">
        </div>

        <h1 class="main-title">苯</h1>
        <p class="subtitle">一个小小的服务器</p>
        <p class="version">原版 1.21.11</p>
    </section>

    <main class="sections">
        <article class="section">
            <h2 class="section-title">News 新闻</h2>
            <p class="placeholder">暂无新闻</p>
        </article>

        <article class="section">
            <h2 class="section-title">Event 事件</h2>
            <p>服务器摄影：拍摄服务器建筑、人文照片，投稿到mc_benzene@163.com。</p>
        </article>

        <article class="section">
            <h2 class="section-title">Gallery 画廊</h2>
            <p>这里是服务器画廊。</p>
            <div class="gallery-grid">
                <img src="Gallery/2026-05-23_10.12.22.png" alt="画廊图片 1">
                <img src="Gallery/2026-06-13_23.30.09.png" alt="画廊图片 2">
                <img src="Gallery/2026-07-25_15.20.18.png" alt="画廊图片 3">
            </div>
        </article>
    </main>

    <footer>
        <p>苯 · Minecraft 原版服务器</p>
    </footer>

    <div class="lightbox" id="lightbox">
        <img src="" alt="放大图片">
    </div>

    <script>
        const container = document.getElementById('benzeneContainer');
        const ring = document.getElementById('benzeneRing');

        document.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const deltaX = e.clientX - centerX;
            const deltaY = e.clientY - centerY;

            const rotateY = (deltaX / window.innerWidth) * 40;
            const rotateX = -(deltaY / window.innerHeight) * 40;

            ring.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            ring.style.transform = 'rotateX(0deg) rotateY(0deg)';
        });

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = lightbox.querySelector('img');
        const galleryImages = document.querySelectorAll('.gallery-grid img');

        galleryImages.forEach(img => {
            img.addEventListener('click', () => {
                lightboxImg.src = img.src;
                lightboxImg.alt = img.alt;
                lightbox.classList.add('active');
            });
        });

        lightbox.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                lightbox.classList.remove('active');
            }
        });
    </script>
</body>
</html>
